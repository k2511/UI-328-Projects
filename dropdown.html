<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown</title>
    <style>
      .dropdown-btn{
        background-color: black;
        color: white;
        padding:10px;
        cursor: pointer;
      }

      .dropdown-menu a{
        text-decoration: none;
        background-color: orange;
        color: white;
        padding:5px;
        display: block;
        text-align: center;
    
      }

      .dropdown-menu a:hover{
        background-color: purple;
        color: white;
        display: block;
       
      }

      .dropdown-menu{
       position: absolute;
       display: none;
      }

      .dropdown{
        position: relative;
      }


      .dropdown:hover .dropdown-menu{
        display: block;
      }

    </style>
</head>
<body>
    <div class="dropdown">
      <button class="dropdown-btn">Courses</button>
      <div class="dropdown-menu">
        <a href="#">Full Stack</a>
        <a href="#">Mern Stack</a>
        <a href="#">Mean Stack</a>
        <a href="#">UI/UX Stack</a>
        <a href="#">Python Developer</a>
        <a href="#">Java Developer</a>
        <a href="#">Data Anaytics</a>
        <a href="#">Backedn Developer</a>
      </div>
    </div>
</body>
</html>
